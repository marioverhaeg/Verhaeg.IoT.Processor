name: Build and Publish NuGet Package

on:
  push:
    branches:
      - master
    tags:
      - v*

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Pack
        run: |
          PROJECT_VERSION=$(grep '<Version>' Verhaeg.IoT.Processor.csproj | sed -E 's/.*<Version>([^<]+)<\/Version>.*/\1/')
          if [ -z "$PROJECT_VERSION" ]; then
            PROJECT_VERSION="1.0.0"
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION=${VERSION#v}
          else
            VERSION="${PROJECT_VERSION}-ci.${{ github.run_number }}"
          fi
          echo "Packaging version: $VERSION"
          dotnet pack --configuration Release --no-build --output artifacts /p:Version=$VERSION

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: marioverhaeg

      - name: NuGet push
        run: |
          dotnet nuget push artifacts/*.nupkg \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
